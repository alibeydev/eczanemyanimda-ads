    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-soft: #ccfbf1;
      --surface: #ffffff;
      --bg: #f8fafc;
      --text: #0f172a;
      --text-secondary: #475569;
      --border: #e2e8f0;
      --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Üst Menü */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 14px rgba(13, 148, 136, 0.28);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--primary-dark);
    }

    .nav-cta {
      background: var(--text);
      color: #ffffff !important;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13.5px !important;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .nav-cta:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }
