<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eczanem Yanımda — En yakın eczane bilgilerine hızlı, güvenilir ve pratik erişim sağlayan Android uygulaması." />
  <title>Eczanem Yanımda | Resmi Uygulama Sayfası</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0d9488;
      --primary-dark: #0f766e;
      --primary-soft: #ccfbf1;
      --surface: #ffffff;
      --bg: #f8fafc;
      --text: #0f172a;
      --text-secondary: #475569;
      --border: #e2e8f0;
      --shadow-lg: 0 25px 50px -12px rgba(15, 23, 42, 0.08);
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Üst Menü */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      color: #ffffff;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 14px rgba(13, 148, 136, 0.28);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .nav-links a:hover {
      color: var(--primary-dark);
    }

    .nav-cta {
      background: var(--text);
      color: #ffffff !important;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13.5px !important;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .nav-cta:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }

    /* Hero Bölümü */
    .hero {
      background: radial-gradient(circle at 80% 20%, #ccfbf1 0%, transparent 45%),
                  radial-gradient(circle at 10% 10%, #e0f2fe 0%, transparent 40%);
      padding: 64px 24px 72px;
      border-bottom: 1px solid var(--border);
    }

    .hero-grid {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #99f6e4;
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
    }

    h1 {
      font-size: clamp(34px, 4.5vw, 48px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-bottom: 18px;
    }

    h1 span {
      color: var(--primary-dark);
    }

    .hero-desc {
      font-size: 17.5px;
      color: var(--text-secondary);
      margin-bottom: 30px;
      max-width: 540px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 28px;
    }

    .btn-google-play {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: #0f172a;
      color: #ffffff;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 14px;
      box-shadow: 0 14px 28px -10px rgba(15, 23, 42, 0.4);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-google-play:hover {
      background: #1e293b;
      transform: translateY(-2px);
    }

    .btn-gp-text {
      display: flex;
      flex-direction: column;
      text-align: left;
      line-height: 1.15;
    }

    .btn-gp-small {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      font-weight: 600;
    }

    .btn-gp-big {
      font-size: 17px;
      font-weight: 700;
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 14.5px;
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--border);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .btn-outline:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .trust-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 13.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Telefon Maketi */
    .mockup-wrap {
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      width: 290px;
      background: #0f172a;
      border-radius: 38px;
      padding: 12px;
      box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.25);
    }

    .phone-screen {
      background: #f8fafc;
      border-radius: 28px;
      overflow: hidden;
      padding: 20px 16px;
    }

    .phone-notch {
      width: 90px;
      height: 18px;
      background: #0f172a;
      border-radius: 999px;
      margin: -20px auto 16px;
    }

    .app-header-card {
      background: linear-gradient(135deg, #0d9488 0%, #115e59 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .app-header-card small {
      display: block;
      font-size: 11px;
      opacity: 0.85;
      margin-bottom: 4px;
    }

    .app-header-card strong {
      font-size: 16px;
      display: block;
    }

    .mock-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mock-item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .mock-item-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .mock-tag {
      background: #ccfbf1;
      color: var(--primary-dark);
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
    }

    /* Özellikler Bölümü */
    .section {
      max-width: 1080px;
      margin: 0 auto;
      padding: 68px 24px;
    }

    .section-head {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 44px;
    }

    .section-head h2 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .section-head p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14.5px;
      color: var(--text-secondary);
    }

    /* Geliştirici & Doğrulama Kartı */
    .dev-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      box-shadow: var(--shadow-sm);
    }

    .dev-panel h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .dev-panel p {
      font-size: 14.5px;
      color: var(--text-secondary);
      max-width: 560px;
    }

    .dev-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Alt Bilgi */
    footer {
      border-top: 1px solid var(--border);
      background: #ffffff;
      padding: 28px 24px;
    }

    .footer-inner {
      max-width: 1080px;
      margin: 0 auto;
